openapi: 3.0.3
info:
  title: Order Management API
  version: 1.0.0
  description: Swagger specification for the Order CRUD operations built around the Order model.
servers:
  - url: http://localhost:3000
paths:
  /orders:
    get:
      tags:
        - Orders
      summary: List all orders
      operationId: listOrders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags:
        - Orders
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            examples:
              cakeOrder:
                summary: Cake order example
                value:
                  price: 45.99
                  quantity: 2
                  item:
                    category: cake
                    type: Birthday
                    flavor: Chocolate
                    filling: Cream
                    size: 10
                    layers: 2
                    frostingType: Buttercream
                    frostingFlavor: Vanilla
                    decorationType: Sprinkles
                    decorationColor: Red
                    customMessage: Happy Birthday!
                    shape: Round
                    allergies: None
                    specialIngredients: None
                    packagingType: Box
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order payload
  /users:
    get:
      tags:
        - Users
      summary: List all users
      operationId: listUsers
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            examples:
              user:
                summary: User example
                value:
                  name: Jane Doe
                  email: jane.doe@example.com
                  password: correct-horse-battery-staple
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid user payload
        '409':
          description: A user with this email already exists
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by id
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      tags:
        - Users
      summary: Update an existing user
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid user payload
        '404':
          description: User not found
        '409':
          description: A user with this email already exists
    delete:
      tags:
        - Users
      summary: Delete a user by id
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get an order by id
      operationId: getOrderById
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The requested order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    put:
      tags:
        - Orders
      summary: Update an existing order
      operationId: updateOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order payload
        '404':
          description: Order not found
    delete:
      tags:
        - Orders
      summary: Delete an order by id
      operationId: deleteOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '204':
          description: Order deleted successfully
        '404':
          description: Order not found
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: The order identifier
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: The user identifier
      schema:
        type: string
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          example: USR-1001
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
    UserCreateRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple
    UserUpdateRequest:
      type: object
      required:
        - id
        - name
        - email
        - password
      properties:
        id:
          type: string
          example: USR-1001
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple
    Order:
      type: object
      required:
        - id
        - item
        - price
        - quantity
      properties:
        id:
          type: string
          example: ORD-1001
        price:
          type: number
          format: float
          minimum: 0
          example: 45.99
        quantity:
          type: integer
          minimum: 1
          example: 2
        item:
          $ref: '#/components/schemas/OrderItem'
    OrderCreateRequest:
      type: object
      required:
        - item
        - price
        - quantity
      properties:
        price:
          type: number
          format: float
          minimum: 0
          example: 45.99
        quantity:
          type: integer
          minimum: 1
          example: 2
        item:
          $ref: '#/components/schemas/OrderItem'
    OrderUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/Order'
    OrderItem:
      oneOf:
        - $ref: '#/components/schemas/CakeItem'
        - $ref: '#/components/schemas/BookItem'
        - $ref: '#/components/schemas/ToyItem'
      discriminator:
        propertyName: category
        mapping:
          cake: '#/components/schemas/CakeItem'
          book: '#/components/schemas/BookItem'
          toy: '#/components/schemas/ToyItem'
    CakeItem:
      type: object
      required:
        - category
        - type
        - flavor
        - filling
        - size
        - layers
        - frostingType
        - frostingFlavor
        - decorationType
        - decorationColor
        - customMessage
        - shape
        - allergies
        - specialIngredients
        - packagingType
      properties:
        category:
          type: string
          enum:
            - cake
        type:
          type: string
        flavor:
          type: string
        filling:
          type: string
        size:
          type: number
        layers:
          type: integer
        frostingType:
          type: string
        frostingFlavor:
          type: string
        decorationType:
          type: string
        decorationColor:
          type: string
        customMessage:
          type: string
        shape:
          type: string
        allergies:
          type: string
        specialIngredients:
          type: string
        packagingType:
          type: string
    BookItem:
      type: object
      required:
        - category
        - title
        - author
        - genre
        - format
        - language
        - publisher
        - specialEdition
        - packaging
      properties:
        category:
          type: string
          enum:
            - book
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        format:
          type: string
        language:
          type: string
        publisher:
          type: string
        specialEdition:
          type: string
        packaging:
          type: string
    ToyItem:
      type: object
      required:
        - category
        - toyType
        - ageGroup
        - brand
        - material
        - batteryRequired
        - educational
      properties:
        category:
          type: string
          enum:
            - toy
        toyType:
          type: string
        ageGroup:
          type: string
        brand:
          type: string
        material:
          type: string
        batteryRequired:
          type: boolean
        educational:
          type: boolean
